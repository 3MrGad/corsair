[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "corsair-scan"
version = "0.1.0"
description = "CORS misconfiguration scanner for authorized testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "3MrGad" }]
keywords = ["security", "cors", "pentest", "bug-bounty", "appsec", "scanner"]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
corsair = "corsair.cli:main"

[project.urls]
Homepage = "https://github.com/3MrGad/corsair"

[tool.setuptools]
packages = ["corsair"]
